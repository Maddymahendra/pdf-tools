<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JPG to PDF Converter</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f6f7f9;
      color: #17181a;
      font-family: "Plus Jakarta Sans", sans-serif;
    }

    .container {
      width: min(100% - 32px, 1000px);
      margin: 0 auto;
      padding: 42px 0 70px;
    }

    .back {
      display: inline-block;
      margin-bottom: 26px;
      color: #6b6f76;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .back:hover {
      color: #17181a;
    }

    .hero {
      text-align: center;
      margin-bottom: 34px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.1;
      letter-spacing: -1.5px;
      font-weight: 800;
    }

    .hero p {
      margin: 13px auto 0;
      max-width: 620px;
      color: #70747b;
      font-size: 15px;
      line-height: 1.6;
    }

    .workspace {
      background: #ffffff;
      border: 1px solid #e4e6e9;
      border-radius: 22px;
      padding: 26px;
      box-shadow: 0 8px 30px rgba(0,0,0,.04);
    }

    .upload {
      border: 2px dashed #d8dbe0;
      border-radius: 17px;
      padding: 42px 20px;
      text-align: center;
      cursor: pointer;
      transition: .2s ease;
    }

    .upload:hover,
    .upload.dragging {
      border-color: #17181a;
      background: #fafafa;
    }

    .upload-icon {
      width: 54px;
      height: 54px;
      margin: 0 auto 15px;
      border-radius: 15px;
      background: #f0f1f3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
    }

    .upload h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .upload p {
      margin: 8px 0 18px;
      color: #777b82;
      font-size: 13px;
    }

    .upload-button {
      display: inline-block;
      background: #17181a;
      color: white;
      padding: 11px 19px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 700;
    }

    #fileInput {
      display: none;
    }

    .settings {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 24px;
    }

    .setting {
      background: #f7f8f9;
      border: 1px solid #e5e7ea;
      border-radius: 12px;
      padding: 13px;
    }

    .setting label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #666a71;
      margin-bottom: 7px;
    }

    select {
      width: 100%;
      border: 0;
      background: transparent;
      outline: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: #17181a;
      cursor: pointer;
    }

    .images-section {
      margin-top: 28px;
      display: none;
    }

    .images-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 15px;
    }

    .images-header h3 {
      margin: 0;
      font-size: 16px;
    }

    .images-header span {
      color: #777b82;
      font-size: 13px;
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .image-card {
      position: relative;
      border: 1px solid #e1e3e6;
      border-radius: 13px;
      background: #fff;
      overflow: hidden;
      transition: .2s ease;
    }

    .image-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,.06);
    }

    .preview {
      width: 100%;
      height: 155px;
      object-fit: contain;
      display: block;
      background: #f5f6f7;
    }

    .image-info {
      padding: 10px;
    }

    .image-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12px;
      font-weight: 600;
    }

    .image-number {
      color: #8a8e95;
      font-size: 11px;
      margin-top: 3px;
    }

    .remove-image {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.95);
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
      cursor: pointer;
      font-size: 16px;
      line-height: 28px;
    }

    .remove-image:hover {
      background: #17181a;
      color: #fff;
    }

    .actions {
      margin-top: 25px;
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    button {
      font-family: inherit;
    }

    .secondary-button,
    .primary-button {
      border-radius: 10px;
      padding: 12px 19px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .secondary-button {
      border: 1px solid #dfe2e6;
      background: #fff;
      color: #17181a;
    }

    .secondary-button:hover {
      background: #f5f6f7;
    }

    .primary-button {
      border: 0;
      background: #17181a;
      color: #fff;
      min-width: 145px;
    }

    .primary-button:hover {
      background: #303236;
    }

    .primary-button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .status {
      display: none;
      margin-top: 18px;
      padding: 13px 15px;
      border-radius: 10px;
      background: #f5f6f7;
      color: #666a71;
      font-size: 13px;
    }

    .privacy {
      text-align: center;
      margin-top: 22px;
      color: #8a8e95;
      font-size: 12px;
    }

    @media (max-width: 800px) {
      .image-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .settings {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      .container {
        width: min(100% - 20px, 1000px);
        padding-top: 25px;
      }

      .workspace {
        padding: 16px;
        border-radius: 17px;
      }

      .image-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .preview {
        height: 130px;
      }

      .actions {
        flex-direction: column-reverse;
      }

      .secondary-button,
      .primary-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <a class="back" href="index.html">← Back to all tools</a>

    <section class="hero">
      <h1>JPG to PDF</h1>
      <p>
        Turn your JPG and PNG images into a clean PDF in seconds.
        Arrange your images, choose your page settings, and download.
      </p>
    </section>

    <section class="workspace">

      <label class="upload" id="uploadArea">
        <div class="upload-icon">↑</div>

        <h2>Drop your images here</h2>

        <p>
          JPG, JPEG or PNG • Multiple images supported
        </p>

        <span class="upload-button">
          Choose images
        </span>

        <input
          type="file"
          id="fileInput"
          accept="image/jpeg,image/png"
          multiple
        >
      </label>

      <div class="settings">

        <div class="setting">
          <label for="pageSize">Page size</label>

          <select id="pageSize">
            <option value="a4">A4</option>
            <option value="letter">Letter</option>
            <option value="image">Image size</option>
          </select>
        </div>

        <div class="setting">
          <label for="orientation">Orientation</label>

          <select id="orientation">
            <option value="portrait">Portrait</option>
            <option value="landscape">Landscape</option>
            <option value="auto">Auto</option>
          </select>
        </div>

        <div class="setting">
          <label for="margin">Margin</label>

          <select id="margin">
            <option value="10">10 mm</option>
            <option value="5">5 mm</option>
            <option value="0">No margin</option>
          </select>
        </div>

      </div>

      <section class="images-section" id="imagesSection">

        <div class="images-header">
          <h3>Selected images</h3>
          <span id="imageCount">0 images</span>
        </div>

        <div class="image-grid" id="imageGrid"></div>

      </section>

      <div class="status" id="status"></div>

      <div class="actions">

        <button
          class="secondary-button"
          id="clearButton"
          type="button"
        >
          Clear all
        </button>

        <button
          class="primary-button"
          id="createButton"
          type="button"
          disabled
        >
          Create PDF
        </button>

      </div>

    </section>

    <div class="privacy">
      Your images are processed in your browser and are not uploaded to a server.
    </div>

  </main>

  <script>
    const { jsPDF } = window.jspdf;

    const fileInput = document.getElementById("fileInput");
    const uploadArea = document.getElementById("uploadArea");
    const imageGrid = document.getElementById("imageGrid");
    const imagesSection = document.getElementById("imagesSection");
    const imageCount = document.getElementById("imageCount");
    const createButton = document.getElementById("createButton");
    const clearButton = document.getElementById("clearButton");
    const status = document.getElementById("status");

    let images = [];

    fileInput.addEventListener("change", function () {
      addFiles(this.files);
      this.value = "";
    });

    uploadArea.addEventListener("dragover", function (event) {
      event.preventDefault();
      uploadArea.classList.add("dragging");
    });

    uploadArea.addEventListener("dragleave", function () {
      uploadArea.classList.remove("dragging");
    });

    uploadArea.addEventListener("drop", function (event) {
      event.preventDefault();
      uploadArea.classList.remove("dragging");

      addFiles(event.dataTransfer.files);
    });

    function addFiles(files) {

      const validFiles = Array.from(files).filter(file =>
        file.type === "image/jpeg" ||
        file.type === "image/png"
      );

      validFiles.forEach(file => {

        const reader = new FileReader();

        reader.onload = function (event) {

          images.push({
            file: file,
            src: event.target.result,
            name: file.name
          });

          renderImages();
        };

        reader.readAsDataURL(file);
      });
    }

    function renderImages() {

      imageGrid.innerHTML = "";

      imagesSection.style.display =
        images.length ? "block" : "none";

      createButton.disabled =
        images.length === 0;

      imageCount.textContent =
        `${images.length} ${images.length === 1 ? "image" : "images"}`;

      images.forEach((image, index) => {

        const card = document.createElement("div");
        card.className = "image-card";

        card.innerHTML = `
          <img
            class="preview"
            src="${image.src}"
            alt=""
          >

          <button
            class="remove-image"
            type="button"
            title="Remove image"
          >
            ×
          </button>

          <div class="image-info">
            <div class="image-name">
              ${escapeHtml(image.name)}
            </div>

            <div class="image-number">
              Page ${index + 1}
            </div>
          </div>
        `;

        card
          .querySelector(".remove-image")
          .addEventListener("click", function () {

            images.splice(index, 1);
            renderImages();

          });

        imageGrid.appendChild(card);
      });
    }

    function escapeHtml(text) {

      const div = document.createElement("div");
      div.textContent = text;

      return div.innerHTML;
    }

    clearButton.addEventListener("click", function () {

      images = [];

      renderImages();

      status.style.display = "none";
      status.textContent = "";
    });

    createButton.addEventListener("click", createPDF);

    async function createPDF() {

      if (!images.length) return;

      createButton.disabled = true;
      clearButton.disabled = true;

      status.style.display = "block";
      status.textContent = "Creating your PDF...";

      try {

        const pageSize =
          document.getElementById("pageSize").value;

        const orientation =
          document.getElementById("orientation").value;

        const margin =
          Number(document.getElementById("margin").value);

        let pdf;

        if (pageSize === "image") {

          const firstImage = await loadImage(images[0].src);

          const width = firstImage.naturalWidth;
          const height = firstImage.naturalHeight;

          const firstOrientation =
            width > height ? "landscape" : "portrait";

          pdf = new jsPDF({
            orientation:
              orientation === "auto"
                ? firstOrientation
                : orientation,
            unit: "px",
            format: [width, height]
          });

        } else {

          let selectedOrientation = orientation;

          if (selectedOrientation === "auto") {

            const firstImage =
              await loadImage(images[0].src);

            selectedOrientation =
              firstImage.naturalWidth >
              firstImage.naturalHeight
                ? "landscape"
                : "portrait";
          }

          pdf = new jsPDF({
            orientation: selectedOrientation,
            unit: "mm",
            format: pageSize
          });
        }

        for (let i = 0; i < images.length; i++) {

          status.textContent =
            `Creating PDF... ${i + 1} of ${images.length}`;

          const image =
            await loadImage(images[i].src);

          if (i > 0) {

            if (pageSize === "image") {

              const width = image.naturalWidth;
              const height = image.naturalHeight;

              pdf.addPage(
                [width, height],
                width > height
                  ? "landscape"
                  : "portrait"
              );

            } else {

              pdf.addPage(
                pageSize,
                orientation === "auto"
                  ? (
                      image.naturalWidth >
                      image.naturalHeight
                        ? "landscape"
                        : "portrait"
                    )
                  : orientation
              );
            }
          }

          addImageToPDF(
            pdf,
            image,
            pageSize,
            margin
          );
        }

        pdf.save("images-to-pdf.pdf");

        status.textContent =
          "PDF created successfully.";

      } catch (error) {

        console.error(error);

        status.textContent =
          "Something went wrong while creating the PDF. Please try again.";

      } finally {

        createButton.disabled = false;
        clearButton.disabled = false;
      }
    }

    function loadImage(src) {

      return new Promise((resolve, reject) => {

        const image = new Image();

        image.onload = () => resolve(image);
        image.onerror = reject;

        image.src = src;
      });
    }

    function addImageToPDF(
      pdf,
      image,
      pageSize,
      margin
    ) {

      if (pageSize === "image") {

        const width = image.naturalWidth;
        const height = image.naturalHeight;

        pdf.addImage(
          image,
          "JPEG",
          0,
          0,
          width,
          height
        );

        return;
      }

      const pageWidth =
        pdf.internal.pageSize.getWidth();

      const pageHeight =
        pdf.internal.pageSize.getHeight();

      const availableWidth =
        pageWidth - margin * 2;

      const availableHeight =
        pageHeight - margin * 2;

      const imageRatio =
        image.naturalWidth /
        image.naturalHeight;

      const pageRatio =
        availableWidth /
        availableHeight;

      let width;
      let height;

      if (imageRatio > pageRatio) {

        width = availableWidth;
        height = width / imageRatio;

      } else {

        height = availableHeight;
        width = height * imageRatio;
      }

      const x =
        (pageWidth - width) / 2;

      const y =
        (pageHeight - height) / 2;

      const format =
        image.src.startsWith("data:image/png")
          ? "PNG"
          : "JPEG";

      pdf.addImage(
        image,
        format,
        x,
        y,
        width,
        height
      );
    }
  </script>

</body>
</html>
