<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PDF to JPG - Free Online PDF Converter</title>
  <meta name="description" content="Convert PDF pages to JPG images directly in your browser. Fast, simple and private.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f6f7f9;
      color: #171717;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 24px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 21px;
      font-weight: 700;
    }

    main {
      max-width: 900px;
      margin: 55px auto;
      padding: 0 20px;
    }

    .hero {
      text-align: center;
      margin-bottom: 35px;
    }

    .hero h1 {
      font-size: 42px;
      margin: 0 0 12px;
      letter-spacing: -1px;
    }

    .hero p {
      color: #666;
      font-size: 17px;
      margin: 0;
    }

    .tool-box {
      background: white;
      border: 1px solid #e3e5e8;
      border-radius: 16px;
      padding: 45px 25px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.04);
    }

    .upload-area {
      border: 2px dashed #cfd3d8;
      border-radius: 12px;
      padding: 45px 20px;
      cursor: pointer;
      transition: 0.2s;
    }

    .upload-area:hover {
      border-color: #111;
      background: #fafafa;
    }

    .upload-icon {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .upload-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .upload-subtitle {
      color: #777;
      margin-bottom: 20px;
    }

    .select-btn {
      display: inline-block;
      background: #111;
      color: white;
      padding: 13px 26px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    input[type="file"] {
      display: none;
    }

    .settings {
      display: none;
      margin-top: 25px;
      padding: 20px;
      background: #f8f8f8;
      border-radius: 10px;
      text-align: left;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    select {
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 7px;
      background: white;
      font-size: 15px;
    }

    .convert-btn {
      margin-top: 20px;
      width: 100%;
      border: none;
      background: #111;
      color: white;
      padding: 15px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .convert-btn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .status {
      margin-top: 20px;
      color: #555;
      display: none;
    }

    .results {
      margin-top: 30px;
      display: none;
    }

    .results h2 {
      font-size: 22px;
      margin-bottom: 15px;
    }

    .result-card {
      background: white;
      border: 1px solid #e2e4e7;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .result-info {
      font-weight: 600;
    }

    .download-btn {
      background: #111;
      color: white;
      text-decoration: none;
      padding: 9px 15px;
      border-radius: 7px;
      font-size: 14px;
      white-space: nowrap;
    }

    .privacy {
      margin-top: 20px;
      color: #777;
      font-size: 14px;
    }

    .more-tools {
      margin-top: 55px;
    }

    .more-tools h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .tool-card {
      background: white;
      border: 1px solid #e3e5e8;
      border-radius: 10px;
      padding: 22px;
      text-align: center;
      color: #777;
    }

    @media (max-width: 650px) {
      .hero h1 {
        font-size: 32px;
      }

      main {
        margin-top: 35px;
      }

      .tool-box {
        padding: 25px 15px;
      }

      .upload-area {
        padding: 35px 15px;
      }

      .tools-grid {
        grid-template-columns: 1fr;
      }

      .result-card {
        flex-direction: column;
        align-items: stretch;
      }

      .download-btn {
        text-align: center;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">PDF Tools</div>
  </div>
</header>

<main>

  <section class="hero">
    <h1>PDF to JPG</h1>
    <p>Convert PDF pages into high-quality JPG images.</p>
  </section>

  <section class="tool-box">

    <label class="upload-area" for="pdfInput">

      <div class="upload-icon">📄</div>

      <div class="upload-title">
        Select a PDF file
      </div>

      <div class="upload-subtitle">
        Your file stays on your device
      </div>

      <span class="select-btn">
        Select PDF
      </span>

    </label>

    <input
      type="file"
      id="pdfInput"
      accept="application/pdf,.pdf"
    >

    <div class="settings" id="settings">

      <div class="settings-row">

        <div>
          <strong id="fileName">PDF file</strong>
          <br>
          <span id="pageCount">0 pages</span>
        </div>

        <div>
          <label for="quality">
            JPG Quality:
          </label>

          <select id="quality">
            <option value="1.5">Standard</option>
            <option value="2">High</option>
            <option value="2.5">Very High</option>
          </select>
        </div>

      </div>

      <button class="convert-btn" id="convertBtn">
        Convert to JPG
      </button>

    </div>

    <div class="status" id="status">
      Preparing your PDF...
    </div>

    <div class="results" id="results">

      <h2>Converted Images</h2>

      <div id="resultList"></div>

    </div>

    <div class="privacy">
      🔒 Your PDF is processed in your browser and is not uploaded by this website.
    </div>

  </section>

  <section class="more-tools">

    <h2>More PDF Tools</h2>

    <div class="tools-grid">

      <div class="tool-card">
        Merge PDF
      </div>

      <div class="tool-card">
        Compress PDF
      </div>

      <div class="tool-card">
        JPG → PDF
      </div>

    </div>

  </section>

</main>

<script type="module">

  import * as pdfjsLib from
    "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.min.mjs";

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.worker.min.mjs";

  const pdfInput = document.getElementById("pdfInput");
  const settings = document.getElementById("settings");
  const fileName = document.getElementById("fileName");
  const pageCount = document.getElementById("pageCount");
  const convertBtn = document.getElementById("convertBtn");
  const status = document.getElementById("status");
  const results = document.getElementById("results");
  const resultList = document.getElementById("resultList");
  const quality = document.getElementById("quality");

  let selectedFile = null;

  pdfInput.addEventListener("change", async function () {

    const file = this.files[0];

    if (!file) {
      return;
    }

    if (file.type !== "application/pdf" &&
        !file.name.toLowerCase().endsWith(".pdf")) {

      alert("Please select a PDF file.");
      return;
    }

    selectedFile = file;

    settings.style.display = "block";
    results.style.display = "none";
    resultList.innerHTML = "";

    fileName.textContent = file.name;

    status.style.display = "block";
    status.textContent = "Reading PDF...";

    try {

      const arrayBuffer = await file.arrayBuffer();

      const pdf = await pdfjsLib.getDocument({
        data: new Uint8Array(arrayBuffer)
      }).promise;

      pageCount.textContent =
        pdf.numPages + (pdf.numPages === 1 ? " page" : " pages");

      status.style.display = "none";

    } catch (error) {

      console.error(error);

      status.textContent =
        "Unable to read this PDF. It may be damaged or password protected.";

    }

  });


  convertBtn.addEventListener("click", async function () {

    if (!selectedFile) {
      return;
    }

    convertBtn.disabled = true;

    results.style.display = "none";
    resultList.innerHTML = "";

    status.style.display = "block";
    status.textContent = "Converting PDF to JPG...";

    try {

      const arrayBuffer = await selectedFile.arrayBuffer();

      const pdf = await pdfjsLib.getDocument({
        data: new Uint8Array(arrayBuffer)
      }).promise;

      const scale = Number(quality.value);

      for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {

        status.textContent =
          "Converting page " +
          pageNumber +
          " of " +
          pdf.numPages +
          "...";

        const page = await pdf.getPage(pageNumber);

        const viewport = page.getViewport({
          scale: scale
        });

        const canvas = document.createElement("canvas");

        const context = canvas.getContext("2d", {
          alpha: false
        });

        canvas.width = Math.ceil(viewport.width);
        canvas.height = Math.ceil(viewport.height);

        context.fillStyle = "#ffffff";
        context.fillRect(
          0,
          0,
          canvas.width,
          canvas.height
        );

        await page.render({
          canvasContext: context,
          viewport: viewport
        }).promise;

        const blob = await new Promise(resolve => {
          canvas.toBlob(
            resolve,
            "image/jpeg",
            0.92
          );
        });

        const url = URL.createObjectURL(blob);

        const card = document.createElement("div");

        card.className = "result-card";

        card.innerHTML = `
          <div class="result-info">
            Page ${pageNumber}
          </div>

          <a
            class="download-btn"
            href="${url}"
            download="${selectedFile.name.replace(/\.pdf$/i, "")}-page-${pageNumber}.jpg"
          >
            Download JPG
          </a>
        `;

        resultList.appendChild(card);
      }

      results.style.display = "block";

      status.textContent =
        "Conversion complete!";

    } catch (error) {

      console.error(error);

      status.textContent =
        "Something went wrong while converting the PDF.";

    }

    convertBtn.disabled = false;

  });

</script>

</body>
</html>
